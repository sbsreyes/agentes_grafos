<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="title description">
  <title id="title">Nodos y arista en un grafo LangGraph</title>
  <desc id="description">Los nodos clasificar, router y ruta_rapida con sus responsabilidades y código Python.</desc>
  <style>
    .description { fill: #475569; font: 18px sans-serif; text-anchor: middle; }
    .node-label { font: 600 19px sans-serif; text-anchor: middle; }
    .tag { fill: #64748b; font: 15px sans-serif; text-anchor: middle; }
    .code { fill: #1e293b; font: 16px monospace; }
  </style>
  <rect width="1440" height="620" fill="#f8fafc"/>

  <text class="description" x="240" y="55">Lee entrada y escribe categoria en el estado</text>
  <text class="description" x="720" y="55">Lee categoria y decide el nombre del siguiente nodo</text>
  <text class="description" x="1200" y="55">Lee entrada y escribe salida en el estado</text>

  <path d="M 332 160 H 628 M 812 160 H 1108" fill="none" stroke="#64748b" stroke-width="3"/>
  <path d="M 616 152 L 632 160 L 616 168 M 1096 152 L 1112 160 L 1096 168" fill="none" stroke="#64748b" stroke-width="3"/>

  <circle cx="240" cy="160" r="70" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <circle cx="720" cy="160" r="70" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <circle cx="1200" cy="160" r="70" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text class="node-label" x="240" y="166" fill="#1d4ed8">clasificar</text>
  <text class="node-label" x="720" y="166" fill="#92400e">router</text>
  <text class="node-label" x="1200" y="166" fill="#1d4ed8">ruta_rapida</text>

  <text class="tag" x="240" y="265">nodo · escribe</text>
  <text class="tag" x="720" y="265">arista · solo lee</text>
  <text class="tag" x="1200" y="265">nodo · escribe</text>

  <rect x="55" y="305" width="370" height="245" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text class="code" x="80" y="350">def clasificar(state):</text>
  <text class="code" x="105" y="385">cat = llm(state["entrada"])</text>
  <text class="code" x="105" y="420">return {"categoria": cat}</text>

  <rect x="535" y="305" width="370" height="245" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text class="code" x="560" y="350">def router(state):</text>
  <text class="code" x="585" y="385">if state["categoria"] == "A":</text>
  <text class="code" x="610" y="420">return "rapida"</text>
  <text class="code" x="585" y="455">return "lenta"</text>

  <rect x="1015" y="305" width="370" height="245" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text class="code" x="1040" y="350">def ruta_rapida(state):</text>
  <text class="code" x="1065" y="385">r = api(state["entrada"])</text>
  <text class="code" x="1065" y="420">return {"salida": r}</text>
</svg>
